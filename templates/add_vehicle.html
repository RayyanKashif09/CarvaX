<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Vehicle — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><a href="/" class="brand"><span>CarvaX</span></a></div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item" data-path="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/vehicles" class="nav-item" data-path="/vehicles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Vehicles</a>
      <a href="/admin" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Admin Panel</a>
      <a href="/vehicles/add" class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Add Vehicle</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Administrator</div>
        </div>
        <button id="logout-btn" title="Logout" style="background:none;border:none;cursor:pointer;color:var(--gray-500);padding:4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <span class="topbar-title">Add Vehicle</span>
    </header>

    <div class="page-content">
      <div class="breadcrumb">
        <a href="/vehicles">Vehicles</a>
        <span class="sep">/</span>
        <span class="current">Add New</span>
      </div>

      <div class="card" style="max-width: 700px;">
        <div class="card-header"><h4 class="card-title">Vehicle Information</h4></div>
        <div class="card-body">
          <div id="alert" class="alert alert-hidden"></div>
          <form id="vehicle-form" enctype="multipart/form-data">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Vehicle Name *</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Model 3 Premium" required>
              </div>
              <div class="form-group">
                <label class="form-label">Brand *</label>
                <input type="text" name="brand" class="form-control" placeholder="e.g. Tesla" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Model *</label>
                <input type="text" name="model" class="form-control" placeholder="e.g. Model 3" required>
              </div>
              <div class="form-group">
                <label class="form-label">Year</label>
                <input type="number" name="year" class="form-control" placeholder="2024" min="1900" max="2099">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Category</label>
                <select name="category" class="form-control">
                  <option>Sedan</option>
                  <option>SUV</option>
                  <option>Sports</option>
                  <option>Luxury</option>
                  <option>Electric</option>
                  <option>Truck</option>
                  <option>Van</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Price Per Day ($) *</label>
                <input type="number" name="price_per_day" class="form-control" placeholder="99.00" step="0.01" min="0" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" placeholder="Vehicle description..."></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Status</label>
                <select name="status" class="form-control">
                  <option value="available">Available</option>
                  <option value="maintenance">Maintenance</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Vehicle Image</label>
                <input type="file" name="image" class="form-control" accept="image/*" id="image-input">
                <div class="form-hint">JPG, PNG, WEBP — max 16MB</div>
              </div>
            </div>
            <div id="image-preview" style="margin-bottom:16px;display:none;">
              <img id="preview-img" style="max-height:160px; border-radius: var(--radius-sm); border: 1px solid var(--gray-200);">
            </div>
            <div class="flex gap-2">
              <button type="submit" class="btn btn-primary" id="submit-btn">Add Vehicle</button>
              <a href="/vehicles" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  if (!requireAuth(true)) throw new Error('redirect');

  document.getElementById('image-input')?.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = ev => {
        document.getElementById('preview-img').src = ev.target.result;
        document.getElementById('image-preview').style.display = '';
      };
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('vehicle-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alert = document.getElementById('alert');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Adding...';

    const formData = new FormData(e.target);
    const res = await apiFetchForm('/vehicles/add', formData);

    btn.disabled = false;
    btn.textContent = 'Add Vehicle';

    if (res && res.ok) {
      showAlert(alert, 'Vehicle added successfully! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/vehicles', 1500);
    } else {
      showAlert(alert, res?.data?.error || 'Failed to add vehicle.');
    }
  });
</script>
</body>
</html>
