<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Detail — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><a href="/" class="brand"><span>CarvaX</span></a></div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item" data-path="/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard
      </a>
      <a href="/vehicles" class="nav-item active" data-path="/vehicles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Vehicles
      </a>
      <a href="/history" class="nav-item" data-path="/history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>History
      </a>
      <div class="nav-section-label admin-only">Admin</div>
      <a href="/admin" class="nav-item admin-only"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Admin Panel</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">...</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Member</div>
        </div>
        <button id="logout-btn" title="Logout" style="background:none;border:none;cursor:pointer;color:var(--gray-500);padding:4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <span class="topbar-title" id="topbar-title">Vehicle Detail</span>
    </header>

    <div class="page-content">
      <div class="breadcrumb">
        <a href="/vehicles">Vehicles</a>
        <span class="sep">/</span>
        <span class="current" id="breadcrumb-name">Loading...</span>
      </div>

      <div id="vehicle-content"><div class="loading-center"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  const vehicleId = {{ vehicle_id }};

  async function load() {
    const res = await apiFetch(`/vehicles/${vehicleId}`);
    if (!res || !res.ok) {
      document.getElementById('vehicle-content').innerHTML = '<p class="text-center text-muted mt-4">Vehicle not found.</p>';
      return;
    }
    const v = res.data.vehicle;
    document.getElementById('topbar-title').textContent = v.name;
    document.getElementById('breadcrumb-name').textContent = v.name;

    document.getElementById('vehicle-content').innerHTML = `
      <div class="grid-2" style="align-items: start; gap: 28px;">
        <div>
          <div style="border-radius: var(--radius); overflow:hidden; border: 1px solid var(--gray-200); height: 320px; background: var(--gray-100);">
            <img src="${getVehicleImageUrl(v.image)}" alt="${v.name}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600&q=80'">
          </div>
        </div>
        <div>
          <div class="flex-between mb-2">
            <h2>${v.name}</h2>
            ${statusBadge(v.status)}
          </div>
          <p style="margin-bottom:20px;">${v.description || 'No description available.'}</p>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom:24px;">
            <div class="card" style="padding:14px;">
              <div class="text-xs text-muted" style="text-transform:uppercase;letter-spacing:.08em;">Brand</div>
              <div class="fw-bold mt-1">${v.brand}</div>
            </div>
            <div class="card" style="padding:14px;">
              <div class="text-xs text-muted" style="text-transform:uppercase;letter-spacing:.08em;">Model</div>
              <div class="fw-bold mt-1">${v.model}</div>
            </div>
            <div class="card" style="padding:14px;">
              <div class="text-xs text-muted" style="text-transform:uppercase;letter-spacing:.08em;">Year</div>
              <div class="fw-bold mt-1">${v.year || '—'}</div>
            </div>
            <div class="card" style="padding:14px;">
              <div class="text-xs text-muted" style="text-transform:uppercase;letter-spacing:.08em;">Category</div>
              <div class="fw-bold mt-1">${v.category}</div>
            </div>
          </div>
          <div style="font-size:2rem; font-weight:900; letter-spacing:-0.04em; margin-bottom:20px;">
            ${formatCurrency(v.price_per_day)} <span style="font-size:1rem;font-weight:400;color:var(--gray-400);">/ day</span>
          </div>
          <div class="flex gap-2">
            ${v.status === 'available' ? `<a href="/booking/${v.id}" class="btn btn-primary btn-lg">Book Now</a>` : `<button class="btn btn-secondary btn-lg" disabled>Not Available</button>`}
            ${isAdmin() ? `<a href="/vehicles/edit/${v.id}" class="btn btn-secondary btn-lg">Edit Vehicle</a>` : ''}
          </div>
        </div>
      </div>
    `;
  }

  load();
</script>
</body>
</html>
