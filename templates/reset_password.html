<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-card fade-in">
    <div class="auth-logo"><a href="/" class="brand-name">CarvaX</a></div>
    <h2 class="auth-title">Reset password</h2>
    <p class="auth-subtitle">Enter your reset token and new password</p>

    <div id="alert" class="alert alert-hidden"></div>

    <form id="reset-form">
      <div class="form-group">
        <label class="form-label">Reset Token</label>
        <input type="text" id="token" class="form-control" placeholder="Paste your reset token" required>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">Reset Password</button>
    </form>
    <div class="auth-footer mt-3"><a href="/login">Back to login</a></div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  // Pre-fill token from URL query param if provided
  const params = new URLSearchParams(window.location.search);
  if (params.get('token')) document.getElementById('token').value = params.get('token');

  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alert = document.getElementById('alert');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Resetting...';

    const res = await apiFetch('/auth/reset-password', {
      method: 'POST',
      body: JSON.stringify({
        token: document.getElementById('token').value.trim(),
        password: document.getElementById('password').value,
      }),
    });

    btn.disabled = false;
    btn.textContent = 'Reset Password';

    if (res && res.ok) {
      showAlert(alert, 'Password reset! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = '/login', 2000);
    } else {
      showAlert(alert, res?.data?.error || 'Failed to reset password.');
    }
  });
</script>
</body>
</html>
