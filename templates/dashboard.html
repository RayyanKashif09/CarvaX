<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="/" class="brand"><span>CarvaX</span></a>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/dashboard" class="nav-item" data-path="/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/vehicles" class="nav-item" data-path="/vehicles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        Vehicles
      </a>
      <a href="/history" class="nav-item" data-path="/history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Booking History
      </a>
      <div class="nav-section-label admin-only">Admin</div>
      <a href="/admin" class="nav-item admin-only" data-path="/admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Admin Panel
      </a>
      <div class="nav-section-label">Account</div>
      <a href="/profile" class="nav-item" data-path="/profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Member</div>
        </div>
        <button id="logout-btn" title="Logout" style="background:none;border:none;cursor:pointer;color:var(--gray-500);padding:4px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <a href="/vehicles" class="btn btn-primary btn-sm">+ Book a Vehicle</a>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <h2 id="welcome-msg">Welcome back!</h2>
        <p>Here's a summary of your rentals</p>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-label">Active Rentals</div><div class="stat-value" id="stat-active">—</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" id="stat-completed">—</div></div>
        <div class="stat-card"><div class="stat-label">Total Bookings</div><div class="stat-value" id="stat-total">—</div></div>
        <div class="stat-card"><div class="stat-label">Total Spent</div><div class="stat-value" id="stat-spent">—</div></div>
      </div>

      <!-- Active bookings -->
      <div class="card mb-4">
        <div class="card-header">
          <h4 class="card-title">Active Bookings</h4>
          <a href="/history" class="btn btn-secondary btn-sm">View All</a>
        </div>
        <div class="card-body" id="active-bookings-container">
          <div class="loading-center"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Recent history -->
      <div class="card">
        <div class="card-header">
          <h4 class="card-title">Recent History</h4>
        </div>
        <div class="table-wrapper" id="history-table-wrapper" style="border:none; border-radius: 0 0 var(--radius) var(--radius);">
          <div class="loading-center"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  if (!requireAuth()) throw new Error('redirect');

  async function loadDashboard() {
    const user = getUser();
    document.getElementById('welcome-msg').textContent = `Welcome back, ${user.name.split(' ')[0]}!`;

    const res = await apiFetch('/bookings/history');
    if (!res || !res.ok) return;
    const bookings = res.data.bookings;

    const active = bookings.filter(b => b.status === 'active');
    const completed = bookings.filter(b => b.status === 'completed');
    const totalSpent = completed.reduce((sum, b) => sum + b.total_amount, 0);

    document.getElementById('stat-active').textContent = active.length;
    document.getElementById('stat-completed').textContent = completed.length;
    document.getElementById('stat-total').textContent = bookings.length;
    document.getElementById('stat-spent').textContent = formatCurrency(totalSpent);

    // Active bookings
    const activeContainer = document.getElementById('active-bookings-container');
    if (!active.length) {
      activeContainer.innerHTML = `<div class="empty-state"><h3>No active rentals</h3><p><a href="/vehicles" class="btn btn-primary btn-sm mt-2">Browse Vehicles</a></p></div>`;
    } else {
      activeContainer.innerHTML = `<div class="vehicles-grid">${active.map(b => `
        <div class="card" style="border: 1px solid var(--gray-200);">
          <div style="height:120px; overflow:hidden; border-radius: var(--radius) var(--radius) 0 0;">
            <img src="${getVehicleImageUrl(b.vehicle?.image)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600&q=80'">
          </div>
          <div class="card-body" style="padding: 14px;">
            <div class="fw-bold">${b.vehicle?.name || 'Vehicle'}</div>
            <div class="text-muted text-sm">${b.vehicle?.brand} ${b.vehicle?.model}</div>
            <div class="flex-between mt-2">
              <span class="text-sm">${formatDate(b.start_date)} → ${formatDate(b.end_date)}</span>
              ${statusBadge(b.status)}
            </div>
            <div class="flex-between mt-2">
              <span class="fw-bold">${formatCurrency(b.total_amount)}</span>
              <a href="/return/${b.id}" class="btn btn-secondary btn-sm">Return</a>
            </div>
          </div>
        </div>
      `).join('')}</div>`;
    }

    // Recent table
    const wrapper = document.getElementById('history-table-wrapper');
    const recent = bookings.slice(0, 5);
    if (!recent.length) {
      wrapper.innerHTML = `<div class="empty-state"><h3>No bookings yet</h3></div>`;
    } else {
      wrapper.innerHTML = `<table>
        <thead><tr><th>Vehicle</th><th>Dates</th><th>Days</th><th>Amount</th><th>Status</th><th></th></tr></thead>
        <tbody>${recent.map(b => `
          <tr>
            <td class="td-bold">${b.vehicle?.name || '—'}</td>
            <td>${formatDate(b.start_date)} – ${formatDate(b.end_date)}</td>
            <td>${b.total_days}</td>
            <td class="fw-bold">${formatCurrency(b.total_amount)}</td>
            <td>${statusBadge(b.status)}</td>
            <td><a href="/history" class="btn btn-secondary btn-sm">View</a></td>
          </tr>
        `).join('')}</tbody>
      </table>`;
    }
  }

  loadDashboard();
</script>
</body>
</html>
