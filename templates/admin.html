<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><a href="/" class="brand"><span>CarvaX</span></a></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/dashboard" class="nav-item" data-path="/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/vehicles" class="nav-item" data-path="/vehicles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        Vehicles
      </a>
      <a href="/history" class="nav-item" data-path="/history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Bookings
      </a>
      <div class="nav-section-label">Admin</div>
      <a href="/admin" class="nav-item active" data-path="/admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Admin Panel
      </a>
      <a href="/vehicles/add" class="nav-item" data-path="/vehicles/add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Add Vehicle
      </a>
      <div class="nav-section-label">Account</div>
      <a href="/profile" class="nav-item" data-path="/profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Administrator</div>
        </div>
        <button id="logout-btn" title="Logout" style="background:none;border:none;cursor:pointer;color:var(--gray-500);padding:4px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-title">Admin Panel</span>
      <div class="topbar-actions">
        <a href="/vehicles/add" class="btn btn-primary btn-sm">+ Add Vehicle</a>
      </div>
    </header>

    <div class="page-content">
      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="stat-users">—</div></div>
        <div class="stat-card"><div class="stat-label">Total Vehicles</div><div class="stat-value" id="stat-vehicles">—</div></div>
        <div class="stat-card"><div class="stat-label">Total Bookings</div><div class="stat-value" id="stat-bookings">—</div></div>
        <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value" id="stat-revenue">—</div></div>
        <div class="stat-card"><div class="stat-label">Active Rentals</div><div class="stat-value" id="stat-active">—</div></div>
        <div class="stat-card"><div class="stat-label">Available</div><div class="stat-value" id="stat-available">—</div></div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" data-tab="bookings">Recent Bookings</div>
        <div class="tab" data-tab="users">Users</div>
        <div class="tab" data-tab="vehicles">Vehicles</div>
      </div>

      <div id="tab-bookings" class="tab-content">
        <div class="card">
          <div class="table-wrapper" style="border:none;">
            <div id="bookings-table"><div class="loading-center"><div class="spinner"></div></div></div>
          </div>
        </div>
      </div>

      <div id="tab-users" class="tab-content hidden">
        <div class="card">
          <div class="table-wrapper" style="border:none;">
            <div id="users-table"><div class="loading-center"><div class="spinner"></div></div></div>
          </div>
        </div>
      </div>

      <div id="tab-vehicles" class="tab-content hidden">
        <div class="card">
          <div class="table-wrapper" style="border:none;">
            <div id="vehicles-table"><div class="loading-center"><div class="spinner"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  if (!requireAuth(true)) throw new Error('redirect');

  let allBookings = [], allUsers = [], allVehicles = [];

  async function loadDashboard() {
    const res = await apiFetch('/admin/dashboard');
    if (!res || !res.ok) return;
    const { stats, recent_bookings } = res.data;

    document.getElementById('stat-users').textContent = stats.total_users;
    document.getElementById('stat-vehicles').textContent = stats.total_vehicles;
    document.getElementById('stat-bookings').textContent = stats.total_bookings;
    document.getElementById('stat-revenue').textContent = formatCurrency(stats.total_revenue);
    document.getElementById('stat-active').textContent = stats.active_bookings;
    document.getElementById('stat-available').textContent = stats.available_vehicles;

    allBookings = recent_bookings;
    renderBookings();
  }

  function renderBookings() {
    const el = document.getElementById('bookings-table');
    if (!allBookings.length) { el.innerHTML = '<div class="empty-state"><h3>No bookings</h3></div>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>#</th><th>User</th><th>Vehicle</th><th>Dates</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${allBookings.map(b => `
        <tr>
          <td class="text-muted">#${b.id}</td>
          <td class="td-bold">${b.user?.name || '—'}</td>
          <td>${b.vehicle?.name || '—'}</td>
          <td class="text-sm">${formatDate(b.start_date)} – ${formatDate(b.end_date)}</td>
          <td class="fw-bold">${formatCurrency(b.total_amount)}</td>
          <td>${statusBadge(b.status)}</td>
          <td>
            ${b.status === 'active' ? `<button class="btn btn-secondary btn-sm" onclick="returnBooking(${b.id})">Return</button>` : ''}
          </td>
        </tr>
      `).join('')}</tbody>
    </table>`;
  }

  async function loadUsers() {
    const res = await apiFetch('/admin/users');
    if (!res || !res.ok) return;
    allUsers = res.data.users;
    const el = document.getElementById('users-table');
    if (!allUsers.length) { el.innerHTML = '<div class="empty-state"><h3>No users</h3></div>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead>
      <tbody>${allUsers.map(u => `
        <tr>
          <td class="text-muted">#${u.id}</td>
          <td class="td-bold">${u.name}</td>
          <td>${u.email}</td>
          <td>${u.phone || '—'}</td>
          <td>${statusBadge(u.role === 'admin' ? 'active' : 'pending')} <span class="text-xs">${u.role}</span></td>
          <td class="text-sm text-muted">${formatDate(u.created_at)}</td>
          <td>${u.role !== 'admin' ? `<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}, '${u.name}')">Delete</button>` : ''}</td>
        </tr>
      `).join('')}</tbody>
    </table>`;
  }

  async function loadVehicles() {
    const res = await apiFetch('/vehicles/?status=all');
    if (!res || !res.ok) return;
    allVehicles = res.data.vehicles;
    const el = document.getElementById('vehicles-table');
    if (!allVehicles.length) { el.innerHTML = '<div class="empty-state"><h3>No vehicles</h3></div>'; return; }
    el.innerHTML = `<table>
      <thead><tr><th>Vehicle</th><th>Brand</th><th>Category</th><th>Price/Day</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${allVehicles.map(v => `
        <tr>
          <td class="td-bold">${v.name}</td>
          <td>${v.brand} ${v.model} ${v.year || ''}</td>
          <td><span class="badge badge-gray">${v.category}</span></td>
          <td class="fw-bold">${formatCurrency(v.price_per_day)}</td>
          <td>${statusBadge(v.status)}</td>
          <td class="flex gap-2">
            <a href="/vehicles/edit/${v.id}" class="btn btn-secondary btn-sm">Edit</a>
            <button class="btn btn-danger btn-sm" onclick="deleteVehicle(${v.id}, '${v.name}')">Delete</button>
          </td>
        </tr>
      `).join('')}</tbody>
    </table>`;
  }

  async function returnBooking(id) {
    if (!confirm('Mark this booking as returned?')) return;
    const res = await apiFetch(`/bookings/return/${id}`, { method: 'PUT' });
    if (res && res.ok) loadDashboard();
  }

  async function deleteUser(id, name) {
    if (!confirm(`Delete user "${name}"? This cannot be undone.`)) return;
    const res = await apiFetch(`/admin/users/${id}`, { method: 'DELETE' });
    if (res && res.ok) loadUsers();
  }

  async function deleteVehicle(id, name) {
    if (!confirm(`Delete vehicle "${name}"? This cannot be undone.`)) return;
    const res = await apiFetch(`/vehicles/delete/${id}`, { method: 'DELETE' });
    if (res && res.ok) loadVehicles();
  }

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      tab.classList.add('active');
      const target = tab.getAttribute('data-tab');
      document.getElementById(`tab-${target}`).classList.remove('hidden');
      if (target === 'users' && !allUsers.length) loadUsers();
      if (target === 'vehicles' && !allVehicles.length) loadVehicles();
    });
  });

  loadDashboard();
</script>
</body>
</html>
