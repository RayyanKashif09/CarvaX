<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><a href="/" class="brand"><span>CarvaX</span></a></div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item" data-path="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/vehicles" class="nav-item" data-path="/vehicles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Vehicles</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">...</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Member</div>
        </div>
        <button id="logout-btn" title="Logout" style="background:none;border:none;cursor:pointer;color:var(--gray-500);padding:4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <span class="topbar-title">Search Vehicles</span>
    </header>

    <div class="page-content">
      <div style="max-width:600px; margin-bottom:24px;">
        <div class="search-bar" style="width:100%;">
          <input type="text" id="search-input" placeholder="Search by name, brand, model, or category..." autofocus>
          <button onclick="doSearch()">Search</button>
        </div>
      </div>
      <div id="results"></div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get('q')) {
    document.getElementById('search-input').value = params.get('q');
  }

  async function doSearch() {
    const q = document.getElementById('search-input').value.trim();
    if (!q) { document.getElementById('results').innerHTML = ''; return; }

    document.getElementById('results').innerHTML = '<div class="loading-center"><div class="spinner"></div></div>';
    const res = await apiFetch(`/vehicles/search?q=${encodeURIComponent(q)}`);
    if (!res || !res.ok) return;

    const vehicles = res.data.vehicles;
    if (!vehicles.length) {
      document.getElementById('results').innerHTML = `<div class="empty-state"><h3>No results for "${q}"</h3><p>Try a different keyword</p></div>`;
      return;
    }

    document.getElementById('results').innerHTML = `
      <p class="text-muted text-sm mb-3">${vehicles.length} result${vehicles.length !== 1 ? 's' : ''} for "${q}"</p>
      <div class="vehicles-grid">${vehicles.map(v => `
        <a href="/vehicles/${v.id}" class="vehicle-card fade-in" style="display:block;">
          <div class="vehicle-card-image">
            <img src="${getVehicleImageUrl(v.image)}" alt="${v.name}" onerror="this.src='https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600&q=80'">
          </div>
          <div class="vehicle-card-body">
            <div class="vehicle-card-title">${v.name}</div>
            <div class="vehicle-card-subtitle">${v.brand} ${v.model} ${v.year || ''}</div>
            <div class="vehicle-card-price">${formatCurrency(v.price_per_day)} <span>/ day</span></div>
          </div>
          <div class="vehicle-card-footer">${statusBadge(v.status)} <span class="badge badge-gray">${v.category}</span></div>
        </a>
      `).join('')}</div>`;
  }

  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  if (params.get('q')) doSearch();
</script>
</body>
</html>
