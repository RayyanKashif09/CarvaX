<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-card fade-in">
    <div class="auth-logo"><a href="/" class="brand-name">CarvaX</a></div>
    <h2 class="auth-title">Forgot password?</h2>
    <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>

    <div id="alert" class="alert alert-hidden"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">Send Reset Link</button>
    </form>
    <div class="auth-footer mt-3"><a href="/login">Back to login</a></div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alert = document.getElementById('alert');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Sending...';

    const res = await apiFetch('/auth/forgot-password', {
      method: 'POST',
      body: JSON.stringify({ email: document.getElementById('email').value }),
    });

    btn.disabled = false;
    btn.textContent = 'Send Reset Link';

    if (res && res.ok && res.data.reset_token) {
      showAlert(alert, `Reset token: ${res.data.reset_token} (copy this to reset your password)`, 'info');
    } else if (res && res.ok) {
      showAlert(alert, res.data.message, 'success');
    } else {
      showAlert(alert, res?.data?.error || 'Something went wrong.');
    }
  });
</script>
</body>
</html>
