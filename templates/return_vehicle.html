<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Return Vehicle — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><a href="/" class="brand"><span>CarvaX</span></a></div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item" data-path="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/vehicles" class="nav-item" data-path="/vehicles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Vehicles</a>
      <a href="/history" class="nav-item" data-path="/history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>History</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">...</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Member</div>
        </div>
        <button id="logout-btn" title="Logout" style="background:none;border:none;cursor:pointer;color:var(--gray-500);padding:4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <span class="topbar-title">Return Vehicle</span>
    </header>

    <div class="page-content">
      <div id="content"><div class="loading-center"><div class="spinner"></div></div></div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  if (!requireAuth()) throw new Error('redirect');
  const bookingId = {{ booking_id }};

  async function load() {
    const res = await apiFetch(`/bookings/${bookingId}`);
    if (!res || !res.ok) { window.location.href = '/dashboard'; return; }
    const b = res.data.booking;

    if (b.status === 'completed') {
      document.getElementById('content').innerHTML = `
        <div class="card" style="max-width:500px; margin: 40px auto; text-align:center;">
          <div class="card-body" style="padding:40px;">
            <div style="font-size:3rem; margin-bottom:16px;">✓</div>
            <h3>Vehicle Already Returned</h3>
            <p class="mt-2">This booking has been completed.</p>
            <div class="flex gap-2 mt-4" style="justify-content:center;">
              <a href="/history" class="btn btn-secondary">View History</a>
              <a href="/dashboard" class="btn btn-primary">Dashboard</a>
            </div>
          </div>
        </div>`;
      return;
    }

    document.getElementById('content').innerHTML = `
      <div class="card" style="max-width:500px;">
        <div class="card-header"><h4 class="card-title">Return Confirmation</h4></div>
        <div class="card-body">
          <div id="alert" class="alert alert-hidden"></div>

          <div style="background:var(--gray-50); border-radius:var(--radius-sm); padding:16px; margin-bottom:20px;">
            <div class="flex-between mb-2">
              <span class="text-muted text-sm">Vehicle</span>
              <span class="fw-bold">${b.vehicle?.name}</span>
            </div>
            <div class="flex-between mb-2">
              <span class="text-muted text-sm">Rental Period</span>
              <span class="text-sm">${formatDate(b.start_date)} – ${formatDate(b.end_date)}</span>
            </div>
            <div class="flex-between mb-2">
              <span class="text-muted text-sm">Total Days</span>
              <span class="text-sm">${b.total_days}</span>
            </div>
            <div class="flex-between">
              <span class="text-muted text-sm">Total Amount</span>
              <span class="fw-bold">${formatCurrency(b.total_amount)}</span>
            </div>
          </div>

          <p class="text-muted text-sm mb-4">By confirming, you acknowledge that the vehicle has been returned in good condition. The vehicle will be marked as available for other customers.</p>

          <div class="flex gap-2">
            <button class="btn btn-primary btn-lg" id="confirm-btn" onclick="doReturn()">Confirm Return</button>
            <a href="/dashboard" class="btn btn-secondary btn-lg">Cancel</a>
          </div>
        </div>
      </div>`;
  }

  async function doReturn() {
    const btn = document.getElementById('confirm-btn');
    const alert = document.getElementById('alert');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Processing...';

    const res = await apiFetch(`/bookings/return/${bookingId}`, { method: 'PUT' });

    if (res && res.ok) {
      document.getElementById('content').innerHTML = `
        <div class="card" style="max-width:500px; margin: 40px auto; text-align:center;">
          <div class="card-body" style="padding:40px;">
            <div style="font-size:3rem; margin-bottom:16px; color:var(--success);">✓</div>
            <h3>Vehicle Returned!</h3>
            <p class="mt-2">Thank you for returning the vehicle. Hope to see you again!</p>
            <div class="flex gap-2 mt-4" style="justify-content:center;">
              <a href="/vehicles" class="btn btn-secondary">Browse Vehicles</a>
              <a href="/dashboard" class="btn btn-primary">Dashboard</a>
            </div>
          </div>
        </div>`;
    } else {
      btn.disabled = false;
      btn.textContent = 'Confirm Return';
      showAlert(alert, res?.data?.error || 'Failed to process return.');
    }
  }

  load();
</script>
</body>
</html>
