<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Vehicle — CarvaX</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><a href="/" class="brand"><span>CarvaX</span></a></div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item" data-path="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/vehicles" class="nav-item" data-path="/vehicles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Vehicles</a>
      <a href="/admin" class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Admin Panel</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar" id="sidebar-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role" id="sidebar-user-role">Administrator</div>
        </div>
        <button id="logout-btn" title="Logout" style="background:none;border:none;cursor:pointer;color:var(--gray-500);padding:4px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <span class="topbar-title">Edit Vehicle</span>
    </header>

    <div class="page-content">
      <div class="breadcrumb">
        <a href="/vehicles">Vehicles</a>
        <span class="sep">/</span>
        <span class="current" id="breadcrumb-name">Edit</span>
      </div>

      <div class="card" style="max-width: 700px;">
        <div class="card-header"><h4 class="card-title">Edit Vehicle</h4></div>
        <div class="card-body">
          <div id="alert" class="alert alert-hidden"></div>
          <form id="vehicle-form" enctype="multipart/form-data">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Vehicle Name *</label>
                <input type="text" name="name" id="f-name" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Brand *</label>
                <input type="text" name="brand" id="f-brand" class="form-control" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Model *</label>
                <input type="text" name="model" id="f-model" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Year</label>
                <input type="number" name="year" id="f-year" class="form-control" min="1900" max="2099">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Category</label>
                <select name="category" id="f-category" class="form-control">
                  <option>Sedan</option><option>SUV</option><option>Sports</option>
                  <option>Luxury</option><option>Electric</option><option>Truck</option><option>Van</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Price Per Day ($) *</label>
                <input type="number" name="price_per_day" id="f-price" class="form-control" step="0.01" min="0" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea name="description" id="f-description" class="form-control"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Status</label>
                <select name="status" id="f-status" class="form-control">
                  <option value="available">Available</option>
                  <option value="maintenance">Maintenance</option>
                  <option value="rented">Rented</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">New Image (optional)</label>
                <input type="file" name="image" class="form-control" accept="image/*">
              </div>
            </div>
            <div class="flex gap-2">
              <button type="submit" class="btn btn-primary" id="submit-btn">Save Changes</button>
              <a href="/vehicles" class="btn btn-secondary">Cancel</a>
              <button type="button" class="btn btn-danger" id="delete-btn" style="margin-left:auto;">Delete Vehicle</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
<script>
  if (!requireAuth(true)) throw new Error('redirect');
  const vehicleId = {{ vehicle_id }};

  async function loadVehicle() {
    const res = await apiFetch(`/vehicles/${vehicleId}`);
    if (!res || !res.ok) return;
    const v = res.data.vehicle;
    document.getElementById('breadcrumb-name').textContent = v.name;
    document.getElementById('f-name').value = v.name;
    document.getElementById('f-brand').value = v.brand;
    document.getElementById('f-model').value = v.model;
    document.getElementById('f-year').value = v.year || '';
    document.getElementById('f-price').value = v.price_per_day;
    document.getElementById('f-description').value = v.description || '';
    document.getElementById('f-status').value = v.status;
    const catSel = document.getElementById('f-category');
    for (let opt of catSel.options) if (opt.value === v.category) { opt.selected = true; break; }
  }

  document.getElementById('vehicle-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const alert = document.getElementById('alert');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving...';

    const formData = new FormData(e.target);
    const res = await apiFetchForm(`/vehicles/update/${vehicleId}`, formData, 'PUT');

    btn.disabled = false;
    btn.textContent = 'Save Changes';

    if (res && res.ok) {
      showAlert(alert, 'Vehicle updated successfully!', 'success');
    } else {
      showAlert(alert, res?.data?.error || 'Failed to update vehicle.');
    }
  });

  document.getElementById('delete-btn').addEventListener('click', async () => {
    if (!confirm('Delete this vehicle? This cannot be undone.')) return;
    const res = await apiFetch(`/vehicles/delete/${vehicleId}`, { method: 'DELETE' });
    if (res && res.ok) window.location.href = '/vehicles';
  });

  loadVehicle();
</script>
</body>
</html>
